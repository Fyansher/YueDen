<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' um-cover: https: data:; script-src 'self'; connect-src 'none'"><title>声音 · 悦森盒 YueDen</title><link rel="stylesheet" href="design-tokens.css"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="design-system.css"><link rel="stylesheet" href="v20-layout.css"><link rel="stylesheet" href="audio.css"><link rel="stylesheet" href="playback-controls.css"><link rel="stylesheet" href="theme-tooltips.css"><link rel="stylesheet" href="audio-player-layout.css"></head><body class="audio-display"><header class="titlebar"><div class="window-brand"><img class="brand-glyph" src="assets/icon.svg" alt=""><span>声音</span><small>悦森盒 YueDen</small></div><div class="window-actions"><button id="audioMin" title="最小化"><svg viewBox="0 0 16 16"><path d="M3 8h10"/></svg></button><button id="audioMax" title="最大化"><svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10"/></svg></button><button id="audioClose" title="关闭窗口，继续播放"><svg viewBox="0 0 16 16"><path d="m3 3 10 10M13 3 3 13"/></svg></button></div></header><main class="audio-display-content"><section class="audio-hero"><div class="audio-art"><img id="audioArt" alt="作品封面"></div><div><span class="eyebrow">正在聆听</span><h1 id="audioTitle">声音</h1><p id="audioTrack"></p><p id="audioArtist"></p><p id="audioCodec" class="audio-help"></p></div></section><div class="audio-progress-row"><input id="audioSeek" type="range" min="0" step="0.1" aria-label="播放进度"><span id="audioTime"></span></div><div class="audio-transport"><button data-command="previous" title="上一轨">|◀</button><button data-command="back" title="快退10秒（←）">−10</button><button data-command="toggle" id="audioPlay" class="add-button">播放</button><button data-command="forward" title="快进10秒（→）">+10</button><button data-command="next" title="下一轨">▶|</button><button data-command="mute" title="静音（M）">音量</button><input id="audioVolume" type="range" min="0" max="1" step="0.01" aria-label="音量"></div><div class="audio-full-controls"><button data-command="mode" title="播放模式"></button><label>睡眠<select id="audioSleep"><option value="0">关闭</option><option value="15">15 分钟</option><option value="30">30 分钟</option><option value="60">60 分钟</option><option value="end">本轨结束</option></select></label><button data-command="bookmark">时间书签</button><button data-command="lyrics">歌词与偏移</button></div><p id="audioError" role="status"></p><section class="audio-bookmark-panel"><h3>时间书签</h3><div id="audioBookmarks" class="audio-bookmarks"></div></section><section class="audio-display-columns"><div><h3>播放队列</h3><div id="audioQueue" class="audio-queue"></div><div class="audio-full-controls"><button id="audioPagePrev">上一页</button><span id="audioPage"></span><button id="audioPageNext">下一页</button></div></div><div><h3>歌词</h3><div id="audioLyrics" class="audio-lyrics"></div></div></section></main><script src="playback-controls.js"></script><script src="lyrics-editor.js"></script><script src="appearance.js"></script><script src="audio-window-renderer.js"></script><script src="theme-tooltips.js"></script></body></html>
